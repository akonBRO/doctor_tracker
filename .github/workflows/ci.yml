name: Verify Doctor Tracker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_ORIGIN: http://127.0.0.1:4100
      APP_ORIGIN: http://127.0.0.1:3100
      WEB_ALLOW_LOCAL_HTTP: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/test-e2e.mjs tests/e2e/quality.spec.ts --project=desktop
      - run: npm run test:infrastructure
      - run: bash scripts/verify-systemd.sh
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate
